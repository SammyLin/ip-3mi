<!-- ponytail: 改 js 要手動把 ?v= 加一;math.3mi.ai 的 zone 設定會把 _headers 的 max-age=0 蓋成 4 小時 -->
<script>
const $ = id => document.getElementById(id)
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c])
const rows = (el, pairs) => { el.innerHTML = pairs.filter(([, v]) => v != null && v !== '').map(([k, v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join('') }
const country = code => { try { return new Intl.DisplayNames(['zh-Hant'], { type: 'region' }).of(code) } catch { return code } }
$('year').textContent = new Date().getFullYear()

fetch('/json', { cache: 'no-store' }).then(r => r.json()).then(d => {
  $('ip').textContent = d.ip
  $('ver').textContent = 'IPv' + d.version
  const place = [d.city, d.region, d.country && country(d.country)].filter(Boolean)
  $('where').textContent = [place.join(', '), d.isp].filter(Boolean).join(' · ')
  rows($('net'), [
    ['IP 位址', d.ip],
    ['ISP', d.isp],
    ['ASN', d.asn && 'AS' + d.asn],
    ['國家', d.country && `${country(d.country)} (${d.country})`],
    ['地區', d.region],
    ['城市', d.city],
    ['郵遞區號', d.postalCode],
    ['經緯度', d.latitude && `${d.latitude}, ${d.longitude}`],
    ['時區', d.timezone],
    ['CF 節點', d.colo],
    ['協定', [d.httpProtocol, d.tlsVersion].filter(Boolean).join(' / ')],
  ])
}).catch(() => { $('ip').textContent = '查詢失敗,請重新整理' })

rows($('browser'), [
  ['User-Agent', navigator.userAgent],
  ['語言', navigator.languages?.join(', ') || navigator.language],
  ['時區', Intl.DateTimeFormat().resolvedOptions().timeZone],
  ['螢幕', `${screen.width} × ${screen.height} @${devicePixelRatio}x`],
  ['視窗', `${innerWidth} × ${innerHeight}`],
  ['平台', navigator.userAgentData?.platform || navigator.platform],
  ['CPU 核心', navigator.hardwareConcurrency],
  ['Cookie', navigator.cookieEnabled ? '已啟用' : '已停用'],
  ['Do Not Track', navigator.doNotTrack === '1' ? '開' : '關'],
])

$('copy').onclick = async () => {
  const label = $('copy').querySelector('span')
  try { await navigator.clipboard.writeText($('ip').textContent); label.textContent = '已複製' }
  catch { label.textContent = '複製失敗' }
  setTimeout(() => label.textContent = '複製 IP', 1500)
}
</script>
